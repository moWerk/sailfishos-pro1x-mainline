Syntax 4

SectionUseCase."HiFi" {
	File "/Pro1X/HiFi.conf"
	Comment "Default audio"
}

SectionUseCase."Voice Call" {
	File "/Pro1X/VoiceCall.conf"
	Comment "Phone call audio"
}

BootSequence [
	cset "name='HPHL Volume' 12"
	cset "name='HPHR Volume' 12"
	cset "name='RX_COMP1 Switch' 0"
	cset "name='RX_COMP2 Switch' 0"
	cset "name='HPHL_COMP Switch' 0"
	cset "name='HPHR_COMP Switch' 0"
	cset "name='Spk0 OUT Switch' 0"
	cset "name='Spk1 OUT Switch' 0"
	cset "name='EAR_PA Volume' 16"
	# PipeWire probes the PCMs before it enables any device. An ASoC front-end PCM
	# without a routed back end refuses to open (EINVAL, "no backend DAIs enabled"),
	# which made the probe drop every profile. Keep a route in place so the open
	# succeeds; nothing is powered until a stream runs.
	cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
	cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 1"
]
