# Voice Call: the same devices as HiFi (earpiece preferred) behind a verb that
# routes the DSP voice session (VoiceMMode1) to the RX/VA codec DMA ends and
# starts the pro1x-voicepcm session (see device/audio/pro1x-voice-call).
SectionVerb {
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 1"
		# The VoiceMMode1 mixers are switched by pro1x-voice-call once the keep-alive
		# streams run: set before the codec DMA back end starts, they stall it (the
		# MultiMedia1 playback pointer stays at 0, both call directions silent).
		exec "/usr/bin/env pro1x-voice-call start"
	]

	DisableSequence [
		exec "/usr/bin/env pro1x-voice-call stop"
		cset "name='VoiceMMode1 Capture Mixer VA_CODEC_DMA_TX_0' 0"
		cset "name='RX_CODEC_DMA_RX_0 Voice Mixer VoiceMMode1' 0"
		cset "name='RX_RX0 Digital Volume' 84"
		cset "name='RX_RX1 Digital Volume' 84"
	]

	Value {
		TQ "Voice"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	# See HiFi.conf: one PCM, so the outputs must be declared as conflicting.
	ConflictingDevice [
		"Headphones"
		"Earpiece"
	]

	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX_MACRO RX1 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT1_1 MIX1 INP0' RX1"
		cset "name='RX INT0_1 INTERP' 'RX INT0_1 MIX1'"
		cset "name='RX INT1_1 INTERP' 'RX INT1_1 MIX1'"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='EAR_RDAC Switch' 0"
		cset "name='HPHL_RDAC Switch' 1"
		cset "name='HPHR_RDAC Switch' 1"
		cset "name='CLSH PA Switch' 1"
		cset "name='RX HPH Mode' CLS_AB"
		cset "name='HPHL Switch' 1"
		cset "name='HPHR Switch' 1"
		cset "name='Spk0 OUT Switch' 1"
		cset "name='Spk1 OUT Switch' 1"
	]

	DisableSequence [
		cset "name='Spk0 OUT Switch' 0"
		cset "name='Spk1 OUT Switch' 0"
		cset "name='HPHL Switch' 0"
		cset "name='HPHR Switch' 0"
		cset "name='HPHL_RDAC Switch' 0"
		cset "name='HPHR_RDAC Switch' 0"
		cset "name='RX INT0 DEM MUX' NORMAL_DSM_OUT"
		cset "name='RX INT1 DEM MUX' NORMAL_DSM_OUT"
		cset "name='RX INT0_1 INTERP' ZERO"
		cset "name='RX INT1_1 INTERP' ZERO"
		cset "name='RX INT0_1 MIX1 INP0' ZERO"
		cset "name='RX INT1_1 MIX1 INP0' ZERO"
		cset "name='RX_MACRO RX0 MUX' ZERO"
		cset "name='RX_MACRO RX1 MUX' ZERO"
		# The front-end route (MultiMedia1 -> RX codec DMA 0) stays on, see Pro1X.conf.
	]

	Value {
		PlaybackPriority 150
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	ConflictingDevice [
		"Speaker"
		"Earpiece"
	]

	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX_MACRO RX1 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT1_1 MIX1 INP0' RX1"
		cset "name='RX INT0_1 INTERP' 'RX INT0_1 MIX1'"
		cset "name='RX INT1_1 INTERP' 'RX INT1_1 MIX1'"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='EAR_RDAC Switch' 0"
		cset "name='HPHL_RDAC Switch' 1"
		cset "name='HPHR_RDAC Switch' 1"
		cset "name='CLSH PA Switch' 1"
		cset "name='RX HPH Mode' CLS_AB"
		cset "name='HPHL Switch' 1"
		cset "name='HPHR Switch' 1"
		cset "name='Spk0 OUT Switch' 0"
		cset "name='Spk1 OUT Switch' 0"
	]

	DisableSequence [
		cset "name='HPHL Switch' 0"
		cset "name='HPHR Switch' 0"
		cset "name='HPHL_RDAC Switch' 0"
		cset "name='HPHR_RDAC Switch' 0"
		cset "name='RX INT0 DEM MUX' NORMAL_DSM_OUT"
		cset "name='RX INT1 DEM MUX' NORMAL_DSM_OUT"
		cset "name='RX INT0_1 INTERP' ZERO"
		cset "name='RX INT1_1 INTERP' ZERO"
		cset "name='RX INT0_1 MIX1 INP0' ZERO"
		cset "name='RX INT1_1 MIX1 INP0' ZERO"
		cset "name='RX_MACRO RX0 MUX' ZERO"
		cset "name='RX_MACRO RX1 MUX' ZERO"
		# The front-end route (MultiMedia1 -> RX codec DMA 0) stays on, see Pro1X.conf.
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic" {
	Comment "Built-in microphone"

	# The built-in microphones are digital, on LPASS DMIC pair 2/3 (LPI gpio8/9)
	# behind the VA macro. DMIC3 is the stock handset mic.
	# Capture path: MultiMedia2 <- VA codec DMA 0.
	EnableSequence [
		cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 1"
		cset "name='VA DEC0 MUX' VA_DMIC"
		cset "name='VA DMIC MUX0' DMIC3"
		cset "name='VA_AIF1_CAP Mixer DEC0' 1"
		cset "name='VA_DEC0 Volume' 84"
	]

	DisableSequence [
		cset "name='VA_AIF1_CAP Mixer DEC0' 0"
		cset "name='VA DMIC MUX0' ZERO"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece (calls)"

	# The earpiece is the codec EAR output (RDAC3 fed from the left channel, RX1)
	# together with the left headphone stage. Speaker amplifiers and the right
	# channel are off. EAR_PA Volume: 0 is the loudest, 16 the quietest.
	ConflictingDevice [
		"Speaker"
		"Headphones"
	]

	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX_MACRO RX1 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT1_1 MIX1 INP0' RX1"
		cset "name='RX INT0_1 INTERP' 'RX INT0_1 MIX1'"
		cset "name='RX INT1_1 INTERP' 'RX INT1_1 MIX1'"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='HPHL_RDAC Switch' 1"
		cset "name='HPHR_RDAC Switch' 0"
		cset "name='CLSH PA Switch' 1"
		cset "name='RX HPH Mode' CLS_AB"
		cset "name='HPHR Switch' 0"
		cset "name='HPHL Volume' 12"
		cset "name='RDAC3_MUX' RX1"
		cset "name='EAR_RDAC Switch' 1"
		# Calls bypass PulseAudio (DSP voice path): at EAR_PA 8 and 0 dB digital the
		# earpiece was painfully loud and fed back into the mic. 16 is -18 dB, and
		# the RX digital gains -16 dB (only these were audible; pro1x-voice-call maps
		# the call volume onto them). Restored on disable and with the verb.
		cset "name='EAR_PA Volume' 16"
		cset "name='RX_RX0 Digital Volume' 68"
		cset "name='RX_RX1 Digital Volume' 68"
		cset "name='Spk0 OUT Switch' 0"
		cset "name='Spk1 OUT Switch' 0"
		# Last: HPHL Switch was found off after the sequence (silent earpiece) when it
		# was set before EAR_RDAC; turning it on again made the earpiece play.
		cset "name='HPHL Switch' 1"
	]

	DisableSequence [
		cset "name='EAR_RDAC Switch' 0"
		cset "name='HPHL Switch' 0"
		cset "name='HPHL_RDAC Switch' 0"
		cset "name='CLSH PA Switch' 0"
		cset "name='RX INT0 DEM MUX' NORMAL_DSM_OUT"
		cset "name='RX INT1 DEM MUX' NORMAL_DSM_OUT"
		cset "name='RX INT0_1 INTERP' ZERO"
		cset "name='RX INT1_1 INTERP' ZERO"
		cset "name='RX INT0_1 MIX1 INP0' ZERO"
		cset "name='RX INT1_1 MIX1 INP0' ZERO"
		cset "name='RX_MACRO RX0 MUX' ZERO"
		cset "name='RX_MACRO RX1 MUX' ZERO"
		# The front-end route (MultiMedia1 -> RX codec DMA 0) stays on, see Pro1X.conf.
		cset "name='HPHL Volume' 12"
		cset "name='RX_RX0 Digital Volume' 84"
		cset "name='RX_RX1 Digital Volume' 84"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
	}
}
