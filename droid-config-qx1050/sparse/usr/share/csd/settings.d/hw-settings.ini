; Hardware features of the F(x)tec Pro1-X on the mainline port, read by ssu-sysinfo.
; sensorfwd enables a sensor only when its feature is set here ([available] in
; 20-sensors-default.conf); Settings and the CSD tool use the rest.
; 0 where the hardware is missing or not working on mainline yet.
[features]
AudioMic1=1
AudioMic2=0
BackCamera=1
BackCameraFlash=1
Backlight=1
Battery=1
Bluetooth=1
CellularData=1
CellularVoice=1
ECompass=1
FmRadio=0
FrontCamera=1
FrontCameraFlash=0
GPS=0
CellInfo=1
GSensor=1
Gyro=1
Hall=0
Fingerprint=0
Headset=1
Key=1
LCD=1
LED=1
LightSensor=1
Loudspeaker=1
TOH=0
ProxSensor=1
Receiver=1
SDCard=1
SIM=1
StereoLoudspeaker=0
Touch=1
TouchAuto=0
UsbCharging=1
UsbOtg=0
Vibrator=1
Wifi=1

[LED]
LedType=RGB

[SIM]
ModemCount=1
