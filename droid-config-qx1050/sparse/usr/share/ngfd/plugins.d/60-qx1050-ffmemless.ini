# ngfd uploads one memless effect per name plus a default one; the kernel ff-memless
# core has 16 slots and the stock 50-ffmemless.ini lists 17 names, so ngfd fails with
# ENOSPC on every plain FF_RUMBLE device. Shorter list, as Jolla suggested in
# sailfishos/ngfd PR #3. Unlisted names fall back to the default effect.
[ffmemless]
supported_effects = touch;touch_strong;release;release_strong;short;strong;long;notice;message;attention;alarm;ringtone
