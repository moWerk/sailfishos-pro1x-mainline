# Masks /usr/lib/tmpfiles.d/sailfishos-cgroups.conf on kernels without the cgroup v1 memory
# hierarchy (CONFIG_MEMCG_V1). Without this, systemd-tmpfiles-setup fails on
# /sys/fs/cgroup/memory/noswapping, /run/systemd/boot-status is never created and
# user@<uid>.service (EnvironmentFile=/run/systemd/boot-status/bootstate) cannot start.
