# After droid-config-halium-qx1050 90evdev.ini (Kabouik, the hybris Pro1-X port): the
# keyboard slide switch and the yellow home key. Both keyboard evdev devices count as
# available while the slide switch on gpio-keys is open.
[EVDEV]
KEY_HOMEPAGE=KEY_HOME

[SW_KEYPAD_SLIDE]
Pro1X keyboard=gpio-keys
Keyboard extra keys=gpio-keys
