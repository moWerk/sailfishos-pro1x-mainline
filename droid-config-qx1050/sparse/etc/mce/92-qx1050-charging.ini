# Charge limit (Settings > Battery): mce stops and restarts charging through the
# charging_enabled attribute of the pro1x-charger-icl driver (PMI632 CHGR_ENABLE_CMD).
# 0 stops charging while the phone keeps running from USB.
[Charging]
ControlPath=/sys/bus/platform/drivers/pro1x-charger-icl/1c40000.spmi:pmic@2:charger@1000/charging_enabled
EnableValue=1
DisableValue=0
