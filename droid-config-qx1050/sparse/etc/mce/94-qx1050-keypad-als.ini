# Keyboard backlight: no light-sensor scaling. The LED (white:kbd_backlight) is on/off,
# max_brightness 1, and mce 1.117 scales the keypad level by the [BrightnessKeypad] table
# (30-100 % below 3000 lux) whenever display autobrightness is on, rounding down: 1 x 51 % = 0,
# so the keyboard stayed dark indoors. One step at 100 % keeps it on whenever mce turns it on,
# as it already was with display autobrightness off.
[BrightnessKeypad]
LimitsProfile0=1
LevelsProfile0=100
