; F(x)tec Pro1-X on mainline: the step counter is the ADSP's (SSC), as in 60-qx1050-ssc.conf.
; Read after 90-harbour-steps.conf, which the Steps app ships for hybris phones
; (stepcounteradaptor = hybrisstepcounteradaptor): on mainline there is no hybris adaptor, and
; with that line in effect sensorfw has no step counter at all.
[plugins]
stepcounteradaptor = sscstepcounteradaptor

[available]
stepcountersensor = True
