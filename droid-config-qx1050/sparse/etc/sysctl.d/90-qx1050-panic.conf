# Crash evidence (2026-11-16): a hang that leaves the phone half alive (UI dim and empty, no
# journal) becomes a panic, and the kernel reboots 10 s later. The panic log, the console and
# userspace messages survive that warm reboot in ramoops (/sys/fs/pstore), and
# qx1050-pstore-save copies them to /var/log/pstore at the next boot. A long press reset cuts
# the memory's power and loses them. Remove this file to get the old behaviour (hang, no log).
kernel.panic = 10
kernel.hung_task_panic = 1
kernel.softlockup_panic = 1
kernel.hardlockup_panic = 1
