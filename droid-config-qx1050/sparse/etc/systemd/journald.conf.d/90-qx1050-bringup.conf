# Bring-up: keep the journal on disk, so it can be read from the NixOS recovery boot.
# RuntimeMaxUse: the early journal (before the flush to disk) overflowed at the stock 1 MB
# and lost the first seconds of every boot (ath10k "chan info" lines flood the log).
# SystemMaxUse: at the flush (3.7 s) the clock still reads systemd's build date (the PMIC
# RTC counts from 1970, timed applies the real time at about 8 s), so the previous boot's
# unclean system.journal is renamed to a .journal~ named with that early date. Near the
# limit, the vacuum then deletes it first as the oldest file: every boot lost the previous
# boot's last file, and with it every crash. 1 G keeps the vacuum away; the files set aside
# are moved out of its reach by qx1050-journal-keep.service.
[Journal]
Storage=persistent
SystemMaxUse=1G
RuntimeMaxUse=16M
