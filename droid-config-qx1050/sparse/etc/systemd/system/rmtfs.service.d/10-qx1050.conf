# Wait for the modem's shared memory instead of skipping the service when it is not
# there yet at boot (same idea as the NixOS base, modules/modem.nix).
#
# The modem's EFS lives in files under /var/lib/rmtfs, seeded once from the modemst1/2, fsg
# and fsc partitions, which are only ever read. Before 2026-10-30 rmtfs ran read-only on the
# partitions (-r -P), so everything the modem learned was lost at every boot: GNSS orbits,
# almanac and last position among it, making every GPS start a cold start.
[Unit]
ConditionPathExists=
StartLimitIntervalSec=0

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 1 180); do [ -e /dev/qcom_rmtfs_mem1 ] && exit 0; sleep 1; done; exit 1'
ExecStartPre=/usr/bin/droid/qx1050-rmtfs-seed.sh
ExecStart=
ExecStart=/usr/bin/rmtfs -o /var/lib/rmtfs -s
TimeoutStartSec=240
