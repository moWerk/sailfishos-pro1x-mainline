# mce looks for its charging ControlPath (92-qx1050-charging.ini) once, at start; the
# pro1x-charger-icl module that provides it can load later. Wait for it, up to 30 s.
[Service]
ExecStartPre=-/bin/sh -c 'i=0; while [ ! -e "/sys/bus/platform/drivers/pro1x-charger-icl/1c40000.spmi:pmic@2:charger@1000/charging_enabled" ] && [ $i -lt 30 ]; do i=$((i + 1)); sleep 1; done'
