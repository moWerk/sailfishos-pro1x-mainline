# usb-moded on the mainline kernel: configfs gadget with the upstream function names
# (the hybris Pro1-X uses the vendor gsi.rndis). Developer mode gives usb0 192.168.2.15.
[configfs]
gadget_base_directory = /sys/kernel/config/usb_gadget/g1
function_rndis        = rndis.usb0
function_mtp          = ffs.mtp
gadget_conf_directory = configs/b.1

