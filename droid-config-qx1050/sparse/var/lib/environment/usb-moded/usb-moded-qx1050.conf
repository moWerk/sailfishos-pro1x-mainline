# usb-moded waits this long after a cable connect before choosing a mode, so mce reports
# the charger first and lipstick shows "Charging" with its sound before the USB mode
# notification takes over (as on hybris devices, where Android gadget enumeration gives
# the same order). Without it the mode came 46 ms after the charger and lipstick
# suppressed the charging notification. Option -m: cable connection delay in ms.
USB_MODED_HW_ADAPTATION_ARGS=-m 500
