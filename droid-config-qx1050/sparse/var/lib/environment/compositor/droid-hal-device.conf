# F(x)tec Pro1-X (qx1050), mainline: lipstick on DRM/KMS through Mesa GBM (freedreno, Adreno 610).
EGL_PLATFORM=drm
QT_QPA_PLATFORM=eglfs
QT_QPA_EGLFS_INTEGRATION=eglfs_kms
QT_QPA_EGLFS_KMS_CONFIG=/etc/eglfs-config.json
# 5.99" 1080x2160 panel
QT_QPA_EGLFS_PHYSICAL_WIDTH=68
QT_QPA_EGLFS_PHYSICAL_HEIGHT=136
# freedreno: tiled (GMEM) rendering for the compositor. Its autotune falls back to direct (sysmem)
# rendering for passes with few draws and no clear, which is what a compositor frame is, and on the
# Adreno 610 that misses the vblank: list scrolling had 23-32 % late frames, with this 3-6 %
# (measured 2026-11-23, Settings' list, on top of qx1050-displayqos).
FD_MESA_DEBUG=gmem
