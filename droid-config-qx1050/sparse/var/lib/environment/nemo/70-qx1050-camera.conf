# jolla-camera (Sailfish qtmultimedia camerabin, +v4l fork from native-common) takes its
# GStreamer source from QT_GSTREAMER_CAMERABIN_SRC (the plugin's own knob; the upstream name
# is kept for the stock plugin). libcamerasrc comes with libcamera from native-common.
# Experimental: the viewfinder still needs a non-hybris sink (droideglsink is missing).
QT_GSTREAMER_CAMERABIN_SRC=libcamerasrc
QT_GSTREAMER_CAMERABIN_VIDEOSRC=libcamerasrc
