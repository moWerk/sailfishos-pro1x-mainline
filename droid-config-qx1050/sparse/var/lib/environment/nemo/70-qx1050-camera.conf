# jolla-camera (Sailfish qtmultimedia camerabin, +v4l fork from native-common): libcamerasrc
# as the video source inside wrappercamerabinsrc. Do NOT use QT_GSTREAMER_CAMERABIN_SRC for
# it: that replaces camerabin's whole camera source (meant for droidcamsrc, which has the
# vfsrc/imgsrc pads) and fails with "Failed to link camera source's vfsrc pad".
# The viewfinder renders through Qt's own video renderer; the hybris video texture backend
# (nemo-qtmultimedia-plugins-gstvideotexturebackend, droideglsink) must not be installed.
QT_GSTREAMER_CAMERABIN_VIDEOSRC=libcamerasrc
