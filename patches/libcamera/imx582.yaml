# libcamera 0.7 software ISP tuning for the Pro1X imx582.
# Only BlackLevel and Ccm read tuning data; Awb, Adjust and Agc use fixed constants.
version: 1
algorithms:
  - BlackLevel:
      # 16-bit value, libcamera uses it >> 8. 4096 = 16/255, matching the sensor helper.
      blackLevel: 4096
  - Awb:
  # Needs a calibrated matrix to be useful; add per colour temperature (K) rows:
  # - Ccm:
  #     ccms:
  #       - ct: 6500
  #         ccm: [ 1, 0, 0,  0, 1, 0,  0, 0, 1 ]
  - Adjust:
  - Agc:
  # Contrast autofocus (libipa hill climbing on the software ISP sharpness value); the
  # imx582 has the dw9800 lens, the s5k4h7 is fixed focus.
  - Af:
      # Measured on the Pro1-X (2026-10-25): the sharpness peak is about +-40 codes wide
      # (near object: 729 / 951 / 765 at 420 / 450 / 480), so coarse 64 and fine 16
      # steps are enough. Stats come every 4th frame; 2 ignored measurements cover the
      # lens settling and debounce a refocus.
      coarseStep: 64
      fineStep: 16
      fineRange: 0.08
      ignoreFrames: 2
      # A far-focused frame of a near object loses less than the libipa default 50% of
      # sharpness, which left refocus waiting; noise between measurements is 1-3%.
      maxChange: 0.3
