; F(x)tec Pro1-X on mainline: sensors behind the ADSP (SSC), read through libssc.
; Install to /etc/sensorfw/sensord.conf.d/ only together with a running hexagonrpcd
; (qx1050-hexagonrpcd.service): mce opens ALS and proximity as soon as sensord starts.
; Not installed by default yet (first run pending, see notes/sensors-design.md).
[plugins]
accelerometeradaptor = sscaccelerometeradaptor
gyroscopeadaptor = sscgyroscopeadaptor
magnetometeradaptor = sscmagnetometeradaptor
alsadaptor = sscalsadaptor
proximityadaptor = sscproximityadaptor

; The SSC already reports in the phone's frame: identity. The NixOS ACCEL_MOUNT_MATRIX
; (-1,-1,1) inverted both tilt axes (Dodger X, Horizon Y, auto-rotation; 2026-10-28).
; The magnetometer and gyroscope are assumed to share the frame until measured otherwise.
[accelerometer]
transformation_matrix = "1,0,0,0,1,0,0,0,1"

[gyroscope]
transformation_matrix = "1,0,0,0,1,0,0,0,1"

[magnetometer]
transformation_matrix = "1,0,0,0,1,0,0,0,1"
scale_coefficient = 1
needs_calibration = 0
